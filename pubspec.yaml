name: doortoout
description: A new Flutter project.

publish_to: 'none'

version: 0.0.5+5

# fvm flutter clean && fvm flutter packages pub get && fvm flutter packages pub run build_runner build --delete-conflicting-outputs
# fvm flutter packages pub run build_runner watch --delete-conflicting-outputs

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.3
  cupertino_icons: ^1.0.2
  go_router: ^12.1.0

  mapbox_maps_flutter: ^2.3.0
  geolocator: ^9.0.2
  http: ^1.1.0

  google_fonts: ^6.1.0

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3
  firebase_analytics: ^11.3.3
  firebase_performance: ^0.10.0+8
  firebase_app_installations: ^0.3.1+4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  background_location: ^0.11.8

  permission_handler: ^11.0.1
  app_tracking_transparency: ^2.0.4

  sentry_flutter: ^8.9.0
  share_plus: ^7.2.1

  google_sign_in: ^6.1.5
  sign_in_with_apple: ^5.0.0

  flutter_secure_storage: ^8.0.0
  hive_flutter: ^1.1.0

  country_code_picker: ^3.0.0

  injectable: ^2.1.2
  get_it: ^7.6.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  dartz: ^0.10.1

  version: ^3.0.2

  device_info_plus: ^9.1.0
  package_info_plus: ^4.2.0

  intl: ^0.19.0
  app_settings: ^5.1.1

  dotted_border: ^2.1.0
  smooth_page_indicator: ^1.1.0
  animated_text_kit: ^4.2.2
  animate_do: ^3.1.2
  cached_network_image: ^3.3.0

  fluttertoast: ^8.2.4
  lottie: ^2.6.0
  flutter_native_splash: ^2.3.2
  flutter_dotenv: ^5.1.0

  flutter_inappwebview: ^6.0.0-beta.25

  app_links: ^3.4.5
  url_launcher: ^6.2.1

  units_converter: ^3.0.0
  wheel_chooser: ^1.1.2
  drop_shadow: ^0.1.0
  omni_datetime_picker: ^2.0.1

  easy_localization: ^3.0.5
  easy_localization_loader: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  injectable_generator: ^2.1.6
  freezed: ^2.4.1
  json_serializable: ^6.8.0
  hive_generator: ^2.0.0
  change_app_package_name: ^1.4.0
  flutter_launcher_icons: ^0.14.1
  sentry_dart_plugin: ^2.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/png/app_icon_1024.png"
  adaptive_icon_foreground: "assets/png/app_icon_1024.png"
  adaptive_icon_background: "assets/png/app_background.png"


flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/onboarding/
    - assets/images/permission/
    - assets/png/
    - assets/webp/
    - assets/webp/2x/
    - assets/webp/3x/
    - assets/env/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/font/Pretendard-Bold.otf
        - asset: assets/font/Pretendard-Regular.otf
          weight: 700